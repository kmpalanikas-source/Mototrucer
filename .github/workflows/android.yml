name: Build Android APKs

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build Android APKs
        run: gradle assembleDebug
      - name: Upload Moto Tracker APK
        uses: actions/upload-artifact@v4
        with:
          name: Moto-Tracker-300-Plus-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload Global Car Tracker APK
        uses: actions/upload-artifact@v4
        with:
          name: Global-Car-Tracker-2020-Plus-APK
          path: cars/build/outputs/apk/debug/cars-debug.apk
          if-no-files-found: error
          retention-days: 30